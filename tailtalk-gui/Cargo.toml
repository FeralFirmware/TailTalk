[package]
name = "tailtalk-gui"
version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "tailtalk-gui"
path = "main.rs"

[features]
default = ["tashtalk"]
tashtalk = ["dep:serialport"]
# Opt-in elsewhere; always on for macOS via the target dependency below, since a
# `default` list can't be made target-conditional. See build.rs for the cfg the
# source actually gates on.
ethertalk = ["tailtalk/ethertalk"]

[dependencies]
anyhow = { workspace = true } #unified
axum = "0.8.9"
binhex-rs = "0.1.1"
dirs = "6"
hfs-reader = { workspace = true } #unified
if-addrs = "0.15"
ipp = "6.0.1"
keepawake = "0.6"
mdns-sd = "0.20.0"
rfd = "0.17"
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
serialport = { version = "4", optional = true }
slint = "1"
stuffit = "^0.1"
tailtalk = { workspace = true } #unified
tailtalk-packets = { workspace = true } #unified
tokio = { workspace = true, features = ["io-util"] } #unified
toml = "^1.1"
tracing = { workspace = true } #unified
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# macOS ships libpcap, so EtherTalk costs nothing to build here and is on by default.
[target.'cfg(target_os = "macos")'.dependencies]
tailtalk = { workspace = true, features = ["ethertalk"] }
libc = "0.2"
# Only to reach `Backend::builder()` and turn off the transparent window Slint
# asks winit for by default. `default-features = false` so the renderer choice
# stays whatever the `slint` dependency selects; Cargo unifies the two. Version
# must track `slint` exactly, these crates ship in lockstep.
i-slint-backend-winit = { version = "=1.17.1", default-features = false }

[build-dependencies]
slint-build = "1"

[package.metadata.packager]
product_name = "TailTalk"
identifier = "com.tailtalk.app"
formats = ["app", "dmg", "appimage"]
out_dir = "../dist"
icons = ["../icon.png"]

[[package.metadata.packager.binaries]]
path = "tailtalk-gui"
main = true

[package.metadata.packager.macos]
minimum_system_version = "10.12"
info_plist_path = "Info.plist"

[package.metadata.packager.dmg]
window_size = { width = 540, height = 380 }
app_position = { x = 130, y = 220 }
application_folder_position = { x = 410, y = 220 }
