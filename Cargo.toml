[workspace]
members = [
  "tailtalk-packets",
  "tailtalk-core",
  "tailtalk-net",
  "tailtalk",
  "tailtalk-proto",
  "tailtalk-daemon",
  "examples/nbp-lookup",
  "examples/aep-echo",
  "examples/pap-print",
  "examples/pap-capture",
  "examples/iw-print",
  "examples/afp-server",
  "examples/adsp-stylewriter",
  "examples/sw-rename",
  "tailtalk-gui",
  "tashtalk",
  "hfs-reader",
  "InkTalk/inkproto",
]
resolver = "3"

[workspace.dependencies]
anyhow = "^1.0.104" #unified
byteorder = { version = "^1.5.0", default-features = false } #unified
bytes = { version = "^1.12.1", default-features = false } #unified
clap = { version = "^4.6.6", features = ["derive"] } #unified
encoding_rs = { version = "^0.8.35", default-features = false } #unified
futures = "^0.3.33" #unified
hfs-reader = { path = "hfs-reader", version = "^0.1.1" } #unified
inkproto = { path = "InkTalk/inkproto" }
prost = "^0.14" #unified
tailtalk = { path = "tailtalk", version = "^0.12" } #unified
tailtalk-core = { path = "tailtalk-core", version = "^0.12" } #unified
tailtalk-net = { path = "tailtalk-net", version = "^0.12" } #unified
tailtalk-packets = { path = "tailtalk-packets", version = "^0.12" } #unified
tailtalk-proto = { path = "tailtalk-proto", version = "^0.12" } #unified
tashtalk = { path = "tashtalk", version = "^0.3" } #unified
thiserror = { version = "^2.0.19", default-features = false } #unified
tokio = { version = "^1.53.1", features = ["full", "io-util"] } #unified
tracing = "^0.1.44" #unified

[workspace.package]
version = "0.12.0"
rust-version = "1.90.0"
