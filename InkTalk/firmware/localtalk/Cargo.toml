[package]
name = "localtalk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LocalTalk wire codec: FM-0, bit stuffing, HDLC framing, CRC and LLAP. no_std, host-testable."

[features]
default = []
# defmt derives on public types, so the firmware can log them. Off by
# default so host tests need no defmt in scope.
defmt = ["dep:defmt"]

[dependencies]
defmt = { version = "0.3", optional = true }
heapless = "0.8"
